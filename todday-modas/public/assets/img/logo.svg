<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="tmLogoTitle">
  <title id="tmLogoTitle">Todday Modas</title>
  <!-- Ícone: cabide (estilo editorial, traço terracota) -->
  <g fill="none" stroke="#B4552D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- gancho -->
    <path d="M95 22 c0 -10 16 -10 16 2 c0 8 -6 12 -11 15 v14" />
    <!-- corpo do cabide: barra esquerda/direita formando o triângulo -->
    <path d="M100 53 L28 116 q-10 10 4 12 h136 q14 -2 4 -12 Z" />
  </g>
  <!-- detalhe champagne: barra interna -->
  <line x1="48" y1="104" x2="152" y2="104" stroke="#C6A15B" stroke-width="6" stroke-linecap="round" />
  <!-- wordmark -->
  <text x="212" y="98" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#23201C" letter-spacing="1">Todday</text>
  <text x="214" y="152" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" fill="#C6A15B" letter-spacing="14">MODAS</text>
</svg>
